name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (cron: minute hour day-of-month month day-of-week)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -s -f -m 30 "https://api.timeflow.ijse.shamodha.com/health" || echo "Ping attempted"

